name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. No job here publishes, deploys or writes to the repo.
permissions:
  contents: read

# A superseded run has nothing left to prove; cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in lockstep with .nvmrc / .node-version and package.json packageManager.
  NODE_VERSION: 24.20.0
  PNPM_VERSION: 11.10.0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    # Integration tests run against a real PostgreSQL. A SQLite or in-memory
    # stand-in would prove nothing about the two things the ledger rests on -
    # partial unique indexes and role privileges - so the suite has no mock path
    # and no skip path: without this service the job fails.
    services:
      postgres:
        # Same digest as infra/postgres/docker-compose.yml, so CI and local
        # development agree on the server version byte for byte.
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: ictt_sentinel_test
          POSTGRES_USER: ictt_admin
          # Ephemeral CI service on a job-local network; it holds only fixtures
          # generated by the tests and is destroyed with the runner.
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ictt_admin -d ictt_sentinel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Third-party actions are pinned to immutable commit SHAs. The trailing
      # comment is the human-readable tag only; the SHA is what runs.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0 # check-secrets reads the tracked file set

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert toolchain matches the pin
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      # Cache the pnpm store, not node_modules. The key is derived from the
      # lockfile, so a dependency change cannot resolve to a stale tree.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      # Frozen: CI fails rather than silently updating the lockfile.
      # Scripts stay off; nothing in the dependency set needs one.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Assert the lockfile is unchanged by install
        run: git diff --exit-code -- pnpm-lock.yaml

      # Same gates as `pnpm run verify` locally, run individually so a failure
      # names itself in the job log.
      - name: bootstrap-check
        run: pnpm run bootstrap:check

      - name: verify:config
        run: pnpm run verify:config

      - name: verify:scaffold
        run: pnpm run verify:scaffold

      # The container gate renders the compose file through Docker, which the
      # GitHub-hosted runner provides. It builds no image here; the image build
      # and its hardening smoke are a release-time job, not a per-commit one.
      - name: verify:containers
        run: pnpm run verify:containers

      # The browser artifact is rebuilt and audited on every commit, because
      # what matters is what ends up in the file that ships.
      - name: console:build
        run: pnpm run console:build

      - name: verify:bundle
        run: pnpm run verify:bundle

      # SBOM, license inventory, exact pins, action SHAs and image digests. The
      # committed artifacts are compared, not regenerated, so a stale SBOM fails.
      - name: verify:supply-chain
        run: pnpm run verify:supply-chain

      - name: secrets:check
        run: pnpm run secrets:check

      - name: boundaries:check
        run: pnpm run boundaries:check

      - name: format:check
        run: pnpm run format:check

      - name: lint
        run: pnpm run lint

      - name: typecheck
        run: pnpm run typecheck

      - name: test
        run: pnpm run test
        env:
          ICTT_SENTINEL_TEST_DATABASE_URL: postgres://ictt_admin:ci-local-only@127.0.0.1:5432/ictt_sentinel_test

      # The deterministic fault lab, run again on its own so its five release
      # counters name themselves in the job log rather than being one line
      # inside a 1200-test run.
      - name: fault lab
        run: pnpm run lab

      - name: build
        run: pnpm run build

      - name: Assert the working tree is clean after the build
        run: git status --porcelain --untracked-files=no | tee /dev/stderr | wc -l | grep -qx 0
