# Local PostgreSQL for development only.
#
# Production application containers are NOT in scope here.
#
#   cp .env.example .env.local        # then set POSTGRES_PASSWORD
#   docker compose --env-file ../../.env.local -f docker-compose.yml up -d
#
# Security posture:
#   - Bound to 127.0.0.1 only. The database is never published on a routable
#     interface, not even in development.
#   - POSTGRES_PASSWORD is required. There is no default and no fallback:
#     compose fails rather than starting an unauthenticated database.
#   - trust auth is never used, so POSTGRES_HOST_AUTH_METHOD is absent.
#   - No privileged mode, no host networking, no Docker socket mount.

name: ictt-sentinel-local

services:
  postgres:
    # Pinned to a digest, not just a tag: a tag can be repointed, and this is a
    # security tool's own dependency. Tag shown for readability only.
    # postgres:17.11-alpine, pushed 2026-08-16.
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: ictt-sentinel-postgres
    restart: unless-stopped

    environment:
      # `:?` makes an unset or empty value a hard compose error, so there is no
      # path on which this database starts without a password.
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB is required}'
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER is required}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - generate one with openssl rand -base64 32}'
      # scram-sha-256 for both new and host connections; never trust.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      # Loopback only.
      - '127.0.0.1:5432:5432'

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    command:
      - postgres
      # Reject any connection that is not password authenticated.
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*

volumes:
  postgres-data:
    name: ictt-sentinel-postgres-data
