# Local PostgreSQL, watcher agent and hosted API for development only.
#
#   cp .env.example .env.local        # then set POSTGRES_PASSWORD
#   docker compose --env-file ../../.env.local -f docker-compose.yml up -d
#
# Security posture:
#   - Bound to 127.0.0.1 only. The database is never published on a routable
#     interface, not even in development.
#   - POSTGRES_PASSWORD is required. There is no default and no fallback:
#     compose fails rather than starting an unauthenticated database.
#   - trust auth is never used, so POSTGRES_HOST_AUTH_METHOD is absent.
#   - No privileged mode, no host networking, no Docker socket mount.

name: ictt-sentinel-local

x-ictt-sentinel-service-security: &ictt-sentinel-service-security
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  mem_limit: 512m
  cpus: 1.0
  init: true

services:
  ictt-sentinel-postgres:
    # Pinned to a digest, not just a tag: a tag can be repointed, and this is a
    # security tool's own dependency. Tag shown for readability only.
    # postgres:17.11-alpine, pushed 2026-08-16.
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: ictt-sentinel-postgres
    restart: unless-stopped

    environment:
      # `:?` makes an unset or empty value a hard compose error, so there is no
      # path on which this database starts without a password.
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB is required}'
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER is required}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - generate one with openssl rand -base64 32}'
      # scram-sha-256 for both new and host connections; never trust.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      # Loopback only.
      - '127.0.0.1:5432:5432'

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    command:
      - postgres
      # Reject any connection that is not password authenticated.
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*

  ictt-sentinel-migrate:
    <<: *ictt-sentinel-service-security
    profiles: [migrate]
    image: ictt-sentinel-migrate:local
    build:
      context: ../..
      dockerfile: infra/containers/Containerfile
      target: migrate
    container_name: ictt-sentinel-migrate
    restart: 'no'
    depends_on:
      ictt-sentinel-postgres:
        condition: service_healthy
    environment:
      ICTT_SENTINEL_DATABASE_URL: '${ICTT_SENTINEL_MIGRATOR_DATABASE_URL:?ICTT_SENTINEL_MIGRATOR_DATABASE_URL is required}'

  ictt-sentinel-agent:
    <<: *ictt-sentinel-service-security
    profiles: [agent]
    image: ictt-sentinel-agent:local
    build:
      context: ../..
      dockerfile: infra/containers/Containerfile
      target: agent
    container_name: ictt-sentinel-agent
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      ictt-sentinel-postgres:
        condition: service_healthy
    env_file:
      - path: '${ICTT_SENTINEL_AGENT_ENV_FILE:?ICTT_SENTINEL_AGENT_ENV_FILE is required}'
        required: true
    environment:
      ICTT_SENTINEL_DATABASE_URL: '${ICTT_SENTINEL_AGENT_DATABASE_URL:?ICTT_SENTINEL_AGENT_DATABASE_URL is required}'
      ICTT_SENTINEL_MANIFEST_PATH: /etc/ictt-sentinel/deployment.yml
      ICTT_SENTINEL_POLICY_PATH: /etc/ictt-sentinel/policy.yml
      ICTT_SENTINEL_SHARING_LEVEL: '${ICTT_SENTINEL_SHARING_LEVEL:-local-only}'
      ICTT_SENTINEL_OBSERVE_ENABLED: 'true'
      ICTT_SENTINEL_OBSERVE_HOST: 0.0.0.0
      ICTT_SENTINEL_OBSERVE_PORT: '9464'
    volumes:
      - '${ICTT_SENTINEL_MANIFEST_FILE:?ICTT_SENTINEL_MANIFEST_FILE is required}:/etc/ictt-sentinel/deployment.yml:ro'
      - '${ICTT_SENTINEL_POLICY_FILE:?ICTT_SENTINEL_POLICY_FILE is required}:/etc/ictt-sentinel/policy.yml:ro'
    ports:
      - '127.0.0.1:${ICTT_SENTINEL_AGENT_OBSERVE_PORT:-9464}:9464'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ictt-sentinel-api:
    <<: *ictt-sentinel-service-security
    profiles: [api]
    image: ictt-sentinel-api:local
    build:
      context: ../..
      dockerfile: infra/containers/Containerfile
      target: api
    container_name: ictt-sentinel-api
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      ictt-sentinel-postgres:
        condition: service_healthy
    env_file:
      - path: '${ICTT_SENTINEL_API_ENV_FILE:?ICTT_SENTINEL_API_ENV_FILE is required}'
        required: true
    environment:
      ICTT_SENTINEL_API_DATABASE_URL: '${ICTT_SENTINEL_API_DATABASE_URL:?ICTT_SENTINEL_API_DATABASE_URL is required}'
      ICTT_SENTINEL_API_HOST: 0.0.0.0
      ICTT_SENTINEL_API_PORT: '8080'
    ports:
      - '127.0.0.1:${ICTT_SENTINEL_API_PUBLIC_PORT:-8080}:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
    name: ictt-sentinel-postgres-data
